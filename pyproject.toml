
[project]
name = "car-price-prediction-niai"
version = "0.1.0"
description = "AI-based Pakistani car price prediction system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.8",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv.build-backend]
module-name = "car_price_prediction"
module-root = "src"
